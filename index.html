<style>
/* Register app: brand bar + tabs; sell view = menu grid (left) + receipt-like cart rail (right); cart becomes bottom sheet on phones */
:root{
  --bg:#f4f1ee; --surface:#ffffff; --surface-2:#ece6e0; --ink:#2a1e16; --muted:#7c6d62; --line:#e0d7cf;
  --accent:#6a4529; --accent-ink:#ffffff; --accent-soft:#f0e5da; --pista:#4f7a5b; --pista-soft:#e3eee5;
  --ok:#2e7a4d; --ok-soft:#e1f1e6; --warn:#a86a12; --warn-soft:#fbefd9; --bad:#b0392a; --bad-soft:#f9e2de;
  --shadow:0 10px 30px rgba(60,35,15,.16);
  --f-ui:"IBM Plex Sans Thai",system-ui,"Leelawadee UI","Thonburi",sans-serif;
  --f-display:"Trirong","Noto Serif Thai",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17120f; --surface:#211a15; --surface-2:#2c231d; --ink:#f2e9e1; --muted:#a8998d; --line:#382d25;
  --accent:#d0a178; --accent-ink:#1b130e; --accent-soft:#3a2b20; --pista:#8fbf9b; --pista-soft:#24332a;
  --ok:#7fcf9c; --ok-soft:#1d3226; --warn:#e8b45c; --warn-soft:#3a2d16; --bad:#f08b7c; --bad-soft:#3d211c;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100%;min-height:0}
.app>*{min-width:0}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;gap:14px;min-height:60px}
.brand img{height:34px;width:auto;display:block;border-radius:6px}
@media (prefers-color-scheme:dark){.brand img{background:#f4ede6;padding:3px 6px}}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.status{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)} .dot.busy{background:var(--warn)}
@media (max-width:560px){.status .lbl{display:none}}
main{min-height:0;overflow:auto}
main.locked{overflow:hidden}
.pad{padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));max-width:1180px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
h2.vt{font-family:var(--f-display);font-weight:600;font-size:26px}
h3{font-size:16px;font-weight:600}
.sub{color:var(--muted);font-size:13px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{min-height:54px;font-size:17px}
.in{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:42px;width:100%;min-width:0}
.in:focus{outline:none;border-color:var(--accent)}
.field{display:grid;gap:4px}
.field>span{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.p-cash{background:var(--ok-soft);color:var(--ok)} .pill.p-qr{background:var(--accent-soft);color:var(--accent)} .pill.p-grab{background:var(--pista-soft);color:var(--pista)}
.loading{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:24px}
.loading img{height:80px;margin-bottom:12px;opacity:.9}

/* SELL */
.sell{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);height:100%;min-height:0}
.catalog{overflow:auto;min-height:0;padding:14px 16px 110px max(16px,env(safe-area-inset-left,0px))}
.cats{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:160px;max-width:280px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 12px 10px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;transition:transform .08s,border-color .15s}
.item:hover{border-color:var(--accent)}
.item:active{transform:scale(.98)}
.item .nm{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item .th{font-size:12.5px;color:var(--muted);line-height:1.3}
.item .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;font-size:12px;color:var(--muted)}
.item .pr{color:var(--ink);font-weight:600;font-size:15px}
.item.gel{background:linear-gradient(180deg,var(--pista-soft),var(--surface) 70%)}
.item.out{opacity:.6}
.item .so{position:absolute;top:8px;right:8px}
.item .star{color:var(--accent);font-size:11px;font-weight:600}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.cart{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-right:env(safe-area-inset-right,0px)}
.cart-h{padding:14px 16px 10px;border-bottom:1px dashed var(--line)}
.lines{flex:1;overflow:auto;min-height:0;padding:6px 16px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .nm{font-weight:600;min-width:0}
.line .det{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:-4px}
.line .ctl{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.step button{border:0;background:none;width:34px;height:32px;font-size:18px;line-height:1}
.step span{min-width:24px;text-align:center;font-weight:600}
.cart-f{border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.sumrow{display:flex;justify-content:space-between;font-size:14px}
.sumrow.total{font-size:20px;font-weight:700;align-items:baseline}
.sumrow.total b{font-family:var(--f-display);font-weight:600;font-size:30px}
.linkish{border:0;background:none;color:var(--accent);font-weight:600;padding:2px 0}
.memberbox{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.cartbar,.scrim,.cart .x-close{display:none}
@media (max-width:820px){
  .sell{grid-template-columns:minmax(0,1fr)}
  .catalog{padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cart{position:fixed;left:0;right:0;bottom:0;height:88%;border-left:0;border-radius:18px 18px 0 0;box-shadow:var(--shadow);transform:translateY(105%);transition:transform .25s ease;z-index:30}
  .cart.open{transform:none}
  .cart .x-close{display:block}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29}
  .cartbar{display:flex;position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-between;align-items:center;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 18px;font-weight:600;font-size:16px;box-shadow:var(--shadow)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .search{max-width:none;margin-left:0;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* MODAL */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(20,12,6,.45);padding:16px}
.sheet{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);width:min(580px,100%);max-height:calc(100% - 16px);display:flex;flex-direction:column;min-height:0}
.sheet-h{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h3{font-size:19px}
.sheet-b{padding:4px 18px 16px;overflow:auto;display:grid;gap:14px;min-height:0}
.sheet-f{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;flex-shrink:0}
@media (max-width:600px){.modal{place-items:end stretch;padding:0}.sheet{width:100%;border-radius:18px 18px 0 0;max-height:94%}.sheet-f{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
.grp{display:grid;gap:6px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.grp-h b{font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:44px;display:grid;text-align:left;line-height:1.25;max-width:100%}
.seg button small{color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg button.o small{color:var(--bad)}
.grp.err .grp-h b{color:var(--bad)}
.paytabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paytabs button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;font-weight:600;min-height:52px}
.paytabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bigtotal{text-align:center;padding:6px 0 2px}
.bigtotal b{font-family:var(--f-display);font-size:42px;font-weight:600;display:block;line-height:1.1}
.qrbox{display:grid;place-items:center;gap:6px;padding:12px;background:#fff;border-radius:12px;color:#1b1b1b;justify-self:center}
.qrbox svg{width:220px;height:220px;display:block}
.receipt{background:#fffdfb;color:#221810;border-radius:4px;padding:18px 18px 22px;font-size:13.5px;width:min(340px,100%);justify-self:center;box-shadow:0 1px 0 #e7dfd6,0 6px 18px rgba(60,35,15,.12);font-variant-numeric:tabular-nums}
.receipt .c{text-align:center}
.receipt img{height:56px;width:auto;display:block;margin:0 auto 4px}
.receipt hr{border:0;border-top:1px dashed #b9a99a;margin:8px 0}
.receipt .r{display:flex;justify-content:space-between;gap:10px}
.receipt .d{color:#6d5e52;font-size:12px;padding-left:10px}
.receipt .t{font-size:17px;font-weight:700}
.void-stamp{color:#b0392a;border:2px solid #b0392a;border-radius:6px;padding:2px 10px;font-weight:700;display:inline-block;transform:rotate(-6deg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .btn,.tbl td.num{white-space:nowrap}
.tbl .r{text-align:right}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.voided td{color:var(--muted)}
.tbl tr.voided td.amt{text-decoration:line-through}
.stack{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{padding:14px 16px}
.kpi b{display:block;font-size:26px;font-family:var(--f-display);font-weight:600;line-height:1.2;margin-top:2px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bars{display:grid;gap:10px;padding:14px 16px}
.bar{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:6px}
.hours{display:flex;align-items:flex-end;gap:4px;height:150px;padding:14px 16px 0}
.hours div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.hours i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.hours span{font-size:10px;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
.mi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}
#printArea{display:none}
.phx{display:block;background:var(--surface-2) center/cover no-repeat}
.sth{border:0;padding:0;background:none;display:block}
.sth .phx{width:44px;height:44px;border-radius:10px;border:1px solid var(--line)}
.sth .phx:not(.has)::after{content:"+";display:grid;place-items:center;height:100%;color:var(--muted);font-size:18px}
.bigph{width:100%;aspect-ratio:4/3;border-radius:14px;max-width:100%}
.bigph:not(.has){display:grid;place-items:center;color:var(--muted)}
.mph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mph button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 0 8px;text-align:left;overflow:hidden;display:grid;gap:6px;font-size:13px;font-weight:500}
.mph button .phx{aspect-ratio:4/3}
.mph button span.t{padding:0 10px;line-height:1.3}
.who{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.who b{font-weight:600}
.chan{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.chan button{flex:1;border:0;background:none;border-radius:9px;padding:8px 12px;font-weight:600;color:var(--muted);white-space:nowrap;min-height:40px}
.chan button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(60,35,15,.15)}
.chan-tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--pista-soft);color:var(--pista)}
.item .ph{display:block;margin:-12px -12px 4px;aspect-ratio:4/3;border-radius:13px 13px 0 0;background:var(--surface-2) center/cover no-repeat;max-width:none}
.login{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login-box{width:min(420px,100%);display:grid;gap:18px;text-align:center}
.login-box img.lg{height:90px;width:auto;margin:0 auto}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.names button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 8px;font-weight:600;min-height:56px}
.names button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pinview{display:flex;justify-content:center;gap:12px;height:20px}
.pinview i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pinview i.on{background:var(--ink);border-color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{border:1px solid var(--line);background:var(--surface);border-radius:14px;font-size:24px;font-weight:600;min-height:62px;font-variant-numeric:tabular-nums}
.keypad button.fn{font-size:15px;color:var(--muted)}
@media print{
  @page{margin:0}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:72mm;padding:2mm}
  #printArea .receipt{box-shadow:none;width:100%;padding:0;font-size:12px}
}
</style>

function callServer(fn,args){
  if(inAppsScript()) return new Promise(function(res,rej){ var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej); r[fn].apply(r,args); });
  var url=apiUrl();
  if(!url) return Promise.reject(new Error("NOURL"));
  return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args}),credentials:"omit",redirect:"follow",cache:"no-store"})
    .catch(function(){ throw new Error(navigator.onLine?"เชื่อมต่อ Google Sheet ไม่ได้ ลองอีกครั้ง":"ไม่มีอินเทอร์เน็ต ต่อ Wi-Fi หรือเน็ตมือถือแล้วลองอีกครั้ง"); })
    .then(function(r){ return r.text(); })
    .then(function(t){
      var j; try{ j=JSON.parse(t); }catch(e){ throw new Error("BADURL"); }
      if(!j||j.ok!==true) throw new Error((j&&j.error)||"เกิดข้อผิดพลาด");
      return j.result;
    });
}
function api(fn){

function cartTotals(){
  var sub=S.cart.reduce(function(a,l){return a+l.price*l.qty;},0);
  var disc = S.disc.type==="pct" ? sub*num(S.disc.value)/100 : num(S.disc.value);
  disc=Math.min(Math.max(disc,0),sub);
  var pv=num(S.settings.pointValue);
  var redeemVal=Math.min(S.redeem*pv, sub-disc);
  var total=Math.max(0,Math.round((sub-disc-redeemVal)*100)/100);
  var vat=S.settings.vatMode==="incl7"?Math.round(total*7/107*100)/100:0;
  var earn=S.member?Math.floor(total/Math.max(1,num(S.settings.bahtPerPoint)||25)):0;
  return {sub:sub,disc:disc,redeemVal:redeemVal,total:total,vat:vat,earn:earn,count:S.cart.reduce(function(a,l){return a+l.qty;},0)};
}

/* Thai QR (ถุงเงิน / พร้อมเพย์) */
function crc16(s){ var c=0xFFFF; for(var i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(var j=0;j<8;j++){ c=(c&0x8000)?((c<<1)^0x1021):(c<<1); c&=0xFFFF; } } var h=c.toString(16).toUpperCase(); while(h.length<4) h="0"+h; return h; }
function tlv(s){ var out=[],i=0; while(i+4<=s.length){ var id=s.substr(i,2), n=parseInt(s.substr(i+2,2),10); if(!(n>=0)||i+4+n>s.length) return null; out.push({id:id,v:s.substr(i+4,n)}); i+=4+n; } return i===s.length?out:null; }
function tlvBuild(list){ return list.map(function(x){ return x.id+pad(x.v.length)+x.v; }).join(""); }
/** ตรวจว่าเป็น Thai QR ที่ใช้ได้ คืน {payload, name} หรือ null */
function readThaiQR(text){
  text=String(text||"").trim(); var t=tlv(text); if(!t) return null;
  var get=function(id){ var x=t.filter(function(y){return y.id===id;})[0]; return x?x.v:""; };
  if(get("00")!=="01"||get("53")!=="764") return null;
  var crc=get("63"); if(crc && crc16(text.slice(0,text.length-4))!==crc.toUpperCase()) return null;
  return {payload:text, name:get("59")||"", city:get("60")||""};
}
/** ใส่ยอดเงินลงใน QR ของร้าน (เปลี่ยนเป็น QR แบบระบุยอด) */
function qrWithAmount(payload, amount){
  var t=tlv(payload); if(!t) return "";
  t=t.filter(function(x){ return x.id!=="63"&&x.id!=="54"; });
  t.forEach(function(x){ if(x.id==="01") x.v="12"; });
  if(!t.some(function(x){return x.id==="01";})) t.push({id:"01",v:"12"});
  t.push({id:"54",v:amount.toFixed(2)});
  t.sort(function(a,b){ return +a.id - +b.id; });
  var s=tlvBuild(t)+"6304"; return s+crc16(s);
}
function ppPayload(target, amount){
  function f(id,v){ return id+pad(v.length)+v; }
  var id=String(target||"").replace(/\D/g,""); if(!id) return "";
  var tag,val;
  if(id.length>=15){tag="03";val=id;} else if(id.length===13){tag="02";val=id;} else {tag="01";val=("0000000000000"+id.replace(/^0/,"66")).slice(-13);}
  var s=f("00","01")+f("01",amount?"12":"11")+f("29",f("00","A000000677010111")+f(tag,val))+f("53","764")+(amount?f("54",amount.toFixed(2)):"")+f("58","TH")+"6304";
  return s+crc16(s);
}
function shopQrPayload(amount){
  var q=readThaiQR(S.settings.qrPayload);
  if(q) return {payload:qrWithAmount(q.payload,amount), name:q.name||S.settings.shopName, src:"ถุงเงิน"};
  var p=ppPayload(S.settings.promptpay,amount);
  return p?{payload:p,name:S.settings.shopName,src:"พร้อมเพย์"}:null;
}
function qrSVG(text){ if(typeof qrcode!=="function") return ""; var q=qrcode(0,"M"); q.addData(text); q.make(); return q.createSvgTag({cellSize:6,margin:2,scalable:true}); }

/** เปลี่ยนช่องทางขาย: คิดราคาในบิลใหม่ รายการที่ไม่มีขายในช่องทางนั้นจะถูกนำออก */
function setChannel(name){
  S.channel=name; LS.set("channel",name);
  var removed=[];
  S.cart=S.cart.filter(function(l){
    var m=menuById(l.menuId); var base=m?mPrice(m):null;
    if(base===null){ removed.push(l.name); return false; }
    var p=m.open?num(l.openPrice):base;
    (l.choices||[]).forEach(function(c){ var G=S.groups[c.g]; var x=G&&G.choices.filter(function(y){return y.name===c.c;})[0]; if(x) p+=cPrice(x); });
    l.price=Math.round(p*100)/100; l.key=JSON.stringify([l.menuId,l.choices,l.note,l.price]); return true;
  });
  saveCart(); render();
  if(removed.length) toast("นำออกจากบิล (ไม่มีขายใน "+name+"): "+removed.join(", "),true);
  else if(S.cart.length) toast("ปรับราคาในบิลเป็นราคา "+name+" แล้ว");
}

function saveReceiptPNG(o){
  var W=576,P=28,F='"IBM Plex Sans Thai", sans-serif',rows=[],s=S.settings;
  function C(t,sz,w){ rows.push({c:t,sz:sz||22,w:w||400}); }
  function R(l,r,sz,w){ rows.push({l:l,r:r,sz:sz||22,w:w||400}); }
  function D(t){ rows.push({l:"   "+t,sz:18,col:"#6d5e52"}); }
  function HR(){ rows.push({hr:1}); }
  C(s.shopName,26,600); if(s.address) C(s.address,18); if(s.phone) C("โทร "+s.phone,18); if(s.taxId) C("เลขประจำตัวผู้เสียภาษี "+s.taxId,18);
  C(o.vatMode==="incl7"?"ใบเสร็จรับเงิน/ใบกำกับภาษีอย่างย่อ":"ใบเสร็จรับเงิน",18); HR();
  R("บิล #"+pad(o.no,3),thDate(o.day)+" "+o.time); if(o.channel&&o.channel!=="หน้าร้าน") R("ช่องทาง",o.channel+(o.platformRef?" #"+o.platformRef:"")); if(o.staff) R("พนักงาน",o.staff);
  if(o.status==="ยกเลิก") C("*** ยกเลิกบิล ***",24,700); HR();
  o.items.forEach(function(l){ R(l.qty+" × "+l.name,fmt(l.price*l.qty)); var d=lineDetail(l); if(d) D(d); }); HR();
  R("รวม",fmt(o.subtotal)); if(o.discount) R("ส่วนลด "+(o.discountLabel||""),"−"+fmt(o.discount)); if(o.redeemValue) R("ใช้แต้ม "+o.redeemPts,"−"+fmt(o.redeemValue));
  R("ยอดสุทธิ","฿"+fmt(o.total),28,700);
  if(o.vatMode==="incl7"){ R("มูลค่าก่อน VAT",fmt(o.total-o.vat),18); R("VAT 7%",fmt(o.vat),18); }
  R("ชำระโดย "+o.payment,fmt(o.received)); if(o.payment==="เงินสด") R("เงินทอน",fmt(o.change));
  if(o.memberId){ HR(); R("สมาชิก",o.memberName); R("แต้มที่ได้รับ",String(o.pointsEarned)); }
  if(s.footer){ HR(); C(s.footer,20); }
  var img=new Image(); img.onload=draw; img.onerror=draw; img.src=LOGO;
  function draw(){
    function lh(r){ return r.hr?22:Math.round(r.sz*1.55); }
    var logoH=110, H=P+logoH+12+rows.reduce(function(a,r){return a+lh(r);},0)+P;
    var cv=document.createElement("canvas"); cv.width=W; cv.height=H; var x=cv.getContext("2d");
    x.fillStyle="#fff"; x.fillRect(0,0,W,H);
    if(img.naturalWidth){ var lw=logoH*img.naturalWidth/img.naturalHeight; x.drawImage(img,(W-lw)/2,P,lw,logoH); }
    var y=P+logoH+12; x.textBaseline="middle";
    rows.forEach(function(r){ var h=lh(r), cy=y+h/2;
      if(r.hr){ x.strokeStyle="#b9a99a"; x.setLineDash([6,5]); x.beginPath(); x.moveTo(P,cy); x.lineTo(W-P,cy); x.stroke(); x.setLineDash([]); }
      else { x.font=(r.w||400)+" "+r.sz+"px "+F; x.fillStyle=r.col||"#221810";
        if(r.c!=null){ x.textAlign="center"; x.fillText(r.c,W/2,cy,W-2*P); }
        else { x.textAlign="left"; var rw=r.r?x.measureText(r.r).width:0; x.fillText(r.l,P,cy,W-2*P-rw-16); if(r.r){ x.textAlign="right"; x.fillText(r.r,W-P,cy); } } }
      y+=h; });
    var a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download="ENSOUL-"+o.day+"-"+pad(o.no,3)+".png"; document.body.appendChild(a); a.click(); a.remove();
  }
}

/* REPORT */
function rangeDates(){
  var r=S.report, t=today(), d;
  if(r.range==="today") return [t,t];
  if(r.range==="yesterday"){ d=new Date(); d.setDate(d.getDate()-1); var y=dayOf(d); return [y,y]; }
  if(r.range==="7d"){ d=new Date(); d.setDate(d.getDate()-6); return [dayOf(d),t]; }
  if(r.range==="month") return [t.slice(0,8)+"01",t];
  return [r.from||t,r.to||t];
}
function loadReport(){
  var rd=rangeDates(); S.report.loading=true;
  api("getReport",rd[0],rd[1]).then(function(rows){ S.report.rows=rows; }).catch(function(e){ S.report.rows=[]; toast(errMsg(e),true); })
    .then(function(){ S.report.loading=false; if(S.view==="report") render(); });
}

function loadJsQR(){
  if(typeof jsQR==="function") return Promise.resolve();
  return new Promise(function(res,rej){ var sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; sc.onload=function(){ res(); }; sc.onerror=function(){ rej(new Error("โหลดตัวอ่าน QR ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่")); }; document.head.appendChild(sc); });
}
function decodeQrFile(file){
  return loadJsQR().then(function(){ return decodeQrFile_(file); });
}
function decodeQrFile_(file){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var tries=[1,0.5,2,0.25], i=0;
      function attempt(){
        if(i>=tries.length){ URL.revokeObjectURL(url); rej(new Error("อ่าน QR จากรูปไม่ได้ ลองครอปให้เห็น QR ชัด ๆ")); return; }
        var sc=tries[i++], w=Math.max(1,Math.round(img.naturalWidth*sc)), h=Math.max(1,Math.round(img.naturalHeight*sc));
        if(w*h>16e6){ attempt(); return; }
        var cv=document.createElement("canvas"); cv.width=w; cv.height=h; var x=cv.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
        var d=x.getImageData(0,0,w,h), r=(typeof jsQR==="function")?jsQR(d.data,w,h,{inversionAttempts:"attemptBoth"}):null;
        if(r&&r.data){ URL.revokeObjectURL(url); res(r.data); } else attempt();
      }
      attempt();
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("เปิดไฟล์รูปไม่ได้")); };
    img.src=url;
  });
}

  if(e.target.id==="sq"){ S.stockQ=e.target.value; swap("slist",'<div id="slist">'+stockListHTML()+'</div>'); }
});
setInterval(function(){ if(S.ready && today()!==S.today && !$("#modal").innerHTML) load(true); }, 60000);
render(); setStatus(); load();
})();
</script>
